name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests (offline, no API keys needed)
        run: pytest -q
      - name: Evaluation gate — baseline must still meet its quality bar
        run: |
          python -m finpilot.intent.baseline
          python -m eval.eval_intent
          python -m eval.gate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finpilot .
      - name: Smoke test the running container
        run: |
          docker run -d -p 8000:8000 --name finpilot finpilot
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/chat -H 'content-type: application/json' \
               -d '{"user_id": 1, "message": "how much did I spend on groceries last month?"}'
